services:
  classmind:
    build:
      context: .
      dockerfile: Dockerfile
    image: classmind-ai:local
    ports:
      - "8000:8000"
    environment:
      CLASSMIND_DATA_DIR: /app/data
      CLASSMIND_LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
